<!doctype html>
<!-- The website's share image (site/og-image.png on main, 1200x630). Render with: node tools/make-site-images.js <out dir> -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Big Shoulders Display';font-weight:800;src:url('fonts/BigShouldersDisplay-ExtraBold.ttf')}
@font-face{font-family:'Libre Franklin';font-weight:500;src:url('fonts/LibreFranklin-Medium.ttf')}
@font-face{font-family:'Libre Franklin';font-weight:600;src:url('fonts/LibreFranklin-SemiBold.ttf')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('fonts/IBMPlexMono-Medium.ttf')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;src:url('fonts/IBMPlexMono-SemiBold.ttf')}
:root{--bg:#0B1621;--panel:#12212F;--ink:#E6EDF2;--muted:#A7B6C3;--line:#26394B;--accent:#F5872F;--us:#6AB3F3}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Libre Franklin',Arial,sans-serif;position:relative}
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;background:radial-gradient(closest-side,rgba(245,135,47,.16),transparent);}
.bar{position:absolute;left:0;top:0;width:100%;height:10px;background:var(--accent)}
.logo{position:absolute;left:72px;top:50px;width:380px;height:auto}
h1{position:absolute;left:72px;top:194px;width:640px;margin:0;font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;font-size:80px;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.sub{position:absolute;left:72px;top:456px;width:640px;margin:0;font-size:24px;line-height:1.38;color:var(--muted);font-weight:500}
.card{position:absolute;left:752px;top:160px;width:376px;height:330px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.card svg{position:absolute;left:0;top:0}
.lbl{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.foot{position:absolute;left:72px;right:72px;bottom:30px;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:17px;color:var(--muted);letter-spacing:.02em}
.foot b{color:var(--ink);font-weight:600}
</style></head>
<body>
<div class="glow"></div>
<div class="bar"></div>
<img class="logo" src="og-logo-dark.png" alt="">
<h1>Know when Aussie prices are behind the US market.</h1>
<p class="sub">7 Aussie bookmakers checked against 8 US sportsbooks, around the clock, with alerts on Telegram.</p>
<div class="card">
  <svg width="376" height="330" viewBox="0 0 376 330" xmlns="http://www.w3.org/2000/svg">
    <text x="24" y="38" class="lbl" fill="#A7B6C3">The lag</text>
    <!-- shaded window between the US move and the Aussie catch-up -->
    <rect x="118" y="78" width="132" height="176" fill="rgba(245,135,47,.14)"/>
    <line x1="118" y1="72" x2="118" y2="262" stroke="#26394B" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="250" y1="72" x2="250" y2="262" stroke="#26394B" stroke-width="1" stroke-dasharray="4 5"/>
    <!-- US market: moves first -->
    <path d="M24 118 H118 V198 H352" fill="none" stroke="#6AB3F3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Aussie price: still on the old line, then catches up -->
    <path d="M24 108 H250 V188 H352" fill="none" stroke="#F5872F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="184" cy="108" r="7" fill="#F5872F" stroke="#12212F" stroke-width="3"/>
    <text x="184" y="94" text-anchor="middle" class="lbl" fill="#F5872F">Alert</text>
    <text x="24" y="292" class="lbl" fill="#6AB3F3">— US market</text>
    <text x="200" y="292" class="lbl" fill="#F5872F">— Aussie price</text>
    <text x="184" y="242" text-anchor="middle" class="lbl" fill="#E6EDF2" style="font-size:12px">old price still up</text>
  </svg>
</div>
<div class="foot"><span><b>oddsaceaustralia.com</b> · Information, not tips</span><span>18+ · Gambling Help 1800 858 858</span></div>
</body></html>
