# Netlify publishes the site folder as it is. There is no build step.
# Only pushes to main deploy (each production deploy uses Netlify credits); the results live on the "data" branch.
[build]
  publish = "site"

# The quarterly results report (PDF and CSV) lives on the "reports" branch and is updated weekly without a deploy.
# This serves it from the domain (oddsaceaustralia.com/reports/latest.pdf), so search engines credit it to the site.
[[redirects]]
  from = "/reports/*"
  to = "https://raw.githubusercontent.com/oddsace-site/website/reports/reports/:splat"
  status = 200
  force = true

# Per-platform links (8 Oct 2026). Each opens the home page at its own address, so Cloudflare Web Analytics counts
# the visits from each platform separately (under Paths); it doesn't record UTM tags or anything after a "?".
# /ig is the Instagram bio link, /fb the Facebook Page's, /yt YouTube's and /x X's. The page's canonical link stays /.
[[redirects]]
  from = "/ig"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/fb"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/yt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/x"
  to = "/index.html"
  status = 200
